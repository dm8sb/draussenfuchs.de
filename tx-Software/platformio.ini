[platformio]
default_envs = lolin_c3_mini

[env:lolin_c3_mini]
platform = espressif32 @ ^6.8.0
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
  -D LED_PIN_1=7
  -D LED_PIN_2=8
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=0
  -D ARDF_VERSION=\"2.0.0\"
; Unit-Tests laufen nativ auf dem PC: pio test -e native
test_ignore = *

; ---- Native Unit-Tests der hardwareunabhängigen Logik ----
; Benötigt einen GCC im PATH (Linux/macOS/Windows mit MinGW).
[env:native]
platform = native
build_flags = -std=gnu++11 -Wall -Wextra
test_build_src = yes
build_src_filter =
  -<*>
  +<morse.cpp>
  +<fox_profile.cpp>
  +<duty_guard.cpp>
  +<config_check.cpp>

; Windows ohne installierten GCC: PlatformIO bringt MinGW mit
;   pio test -e native_win
[env:native_win]
extends = env:native
platform = windows_x86
