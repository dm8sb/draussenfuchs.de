[env:lolin_c3_mini]
platform = espressif32 @ ^6.8.0
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
  -D LED_PIN_1=7
  -D LED_PIN_2=8
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=0
  -D ARDF_VERSION=\"2.0.0\"
lib_deps =
